[project]
name = "better-yt-playlist"
version = "0.1.0"
description = "Fetch YouTube playlist videos and analyze/cluster by theme"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.100",
    "polars>=1.0",
    "duckdb>=1.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.13",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]