[project]
name = "better-yt-playlist"
version = "0.1.0"
description = "Fetch YouTube playlist videos and analyze/cluster by theme"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "duckdb>=1.1",
]
readme = "README.md"

[project.scripts]
better-yt-playlist = "better_yt_playlist.cli:main"
byp = "better_yt_playlist.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "pyright>=1.1",
    "pip-audit>=2.7",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
# Strict on our own package; standard on tests (test doubles and pytest
# fixtures don't benefit from strict's unknown-type rules). `auth.py` and
# `youtube.py` carry a file-level `# pyright: basic` — they are thin wrappers
# over the Google API client, which ships no type stubs.
typeCheckingMode = "standard"
strict = ["src/better_yt_playlist"]
reportMissingTypeStubs = false
