[project]
name = "better-yt-playlist"
version = "0.1.0"
description = "Fetch YouTube playlist videos and analyze/cluster by theme"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.100",
]
readme = "README.md"

[project.scripts]
better-yt-playlist = "better_yt_playlist.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.13",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
