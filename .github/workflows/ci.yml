# Baseline CI for a small/single-package Python repo — mirrors the pre-commit
# baseline (templates/pre-commit/python.yaml) as a required gate, since
# pre-commit itself only runs locally and CI is the only place a required
# check can actually enforce it. Added: typecheck (pyright), security (pip-audit),
# coverage. Path filtering (dorny/paths-filter) can be added when repo grows.
#
# Adopt: fill in pyproject.toml [tool.pyright] when ready; add
# "Typecheck Python", "Security Scan (Python)", "Tests (Python)" as
# required_status_checks contexts in github-standard.json.
#
# Before the first push, check the target repo actually has what this
# workflow assumes:
#   - `ruff`/`pytest`/`pyright`/`pip-audit` must be in the project's own dev dependency group.
#   - ruff >=0.13 formats fenced Python code blocks inside Markdown by
#     default. `ruff format --check .` at a repo root with a docs/ folder
#     will try to reformat illustrative code snippets in prose. Add
#     `extend-exclude = ["docs"]` under `[tool.ruff]` in pyproject.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded pull_request runs are cancelled. Every other event (push to main,
# workflow_dispatch) gets a unique group, so it is never cancelled or replaced
# by a newer pending run -- GitHub drops a pending run in the same group even
# with cancel-in-progress false, which could leave a main commit with no CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default GITHUB_TOKEN scope for every job below — neither lints nor tests
# writes anything (no comments, no pushes, no packages). Least privilege.
permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    # Runner pool is switchable per repo without editing this file: set the
    # CI_RUNNERS repo variable to a JSON array of runner labels — e.g.
    # ["self-hosted","linux","x64"] — to route CI off GitHub-hosted runners
    # when their minutes are unavailable (on a private repo, exhausting the
    # free tier makes every job refuse to start). Unset means ubuntu-latest.
    # See dev-standards' README § CI runners for the commands.
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Persistent homelab runners (named homelab-*) keep ~/.cache/uv on disk, so uploading
          # it is slow and pointless there; keyed on the runner name, not runner.environment,
          # because ephemeral self-hosted services (Ubicloud) need the cache (fitted Issue 361).
          enable-cache: ${{ !contains(runner.name, 'homelab') }}
          cache-dependency-glob: "uv.lock"
          # Must match language_version in .pre-commit-config.yaml, or uv
          # builds the venv on the newest allowed Python and pre-commit
          # can't find python3.13.
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      # Hook envs live in ~/.cache/pre-commit, outside setup-uv's cache.
      # pre-commit rebuilds an env whose interpreter has since changed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Persistent homelab runners keep ~/.cache/pre-commit on disk; restoring or
        # saving it through actions/cache only costs time there (same reasoning as
        # setup-uv's enable-cache above, fitted Issue 361).
        if: ${{ !contains(runner.name, 'homelab') }}
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs the whole .pre-commit-config.yaml so the hygiene hooks gate merges
      # too; a hookless clone, --no-verify or the web editor skips them locally.
      - name: pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  typecheck-python:
    name: Typecheck Python
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Persistent homelab runners (named homelab-*) keep ~/.cache/uv on disk, so uploading
          # it is slow and pointless there; keyed on the runner name, not runner.environment,
          # because ephemeral self-hosted services (Ubicloud) need the cache (fitted Issue 361).
          enable-cache: ${{ !contains(runner.name, 'homelab') }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: pyright
        run: uv run pyright

  security-python:
    name: Security Scan (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Persistent homelab runners (named homelab-*) keep ~/.cache/uv on disk, so uploading
          # it is slow and pointless there; keyed on the runner name, not runner.environment,
          # because ephemeral self-hosted services (Ubicloud) need the cache (fitted Issue 361).
          enable-cache: ${{ !contains(runner.name, 'homelab') }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: pip-audit
        run: uv run pip-audit --local --skip-editable

  test-python:
    name: Tests (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Persistent homelab runners (named homelab-*) keep ~/.cache/uv on disk, so uploading
          # it is slow and pointless there; keyed on the runner name, not runner.environment,
          # because ephemeral self-hosted services (Ubicloud) need the cache (fitted Issue 361).
          enable-cache: ${{ !contains(runner.name, 'homelab') }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Run tests with coverage
        run: uv run pytest --cov=better_yt_playlist --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # Audits the workflow files with zizmor. Blocking: a finding fails the job.
  # The version is pinned so a new upstream audit cannot turn this red between
  # runs; Dependabot does not bump a `uvx` pin, so bump it by hand. GH_TOKEN is
  # the read-only workflow token; it enables the online audits that check each
  # pinned SHA really belongs to the tagged repo.
  audit-workflows:
    name: Audit workflows
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --format=github .github/workflows
